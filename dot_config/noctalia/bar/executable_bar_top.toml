[bar.top]
start = ["launcher", "control-center", "keybinds", "workspaces"]
center = ["clock"]
end = ["tray", "notifications", "clipboard", "bluetooth", "network", "battery", "volume", "session"]

enabled = true
position = "top"
smart_auto_hide = false
layer = "top"
monitor = ""


margin_ends = 300
padding = 16
thickness = 32

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.battery]
show_label = false
